<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>官網版型展示 · 5 版型 × 6 主題 × 4 配色（D 為照片版型 · 方案 2 參考實作）</title>
<style>
  /* ===== 配色（顏色角色）：UI 顏色，配色切換只改這組 ===== */
  :root{
    --primary:#e8734a; --primary-ink:#fff;
    --accent:#2ba58c;
    --bg:#fdf9f4; --card:#ffffff; --line:#eee3d8;
    --ink:#33302c; --muted:#8a8177; --deep:#3c4043;
    --radius:14px; --shadow:0 2px 10px rgba(80,60,30,.08);
    /* 主題素材色（行業示意圖的佔位漸層）：主題切換改這組 */
    --theme-a:#f9e0cd; --theme-b:#e8f5ef; --theme-ink:#33302c;
  }
  :root[data-scheme="persian"]{ /* 參考 SimplyBook Persian：紫＋金 */
    --primary:#6d5bc7; --primary-ink:#fff; --accent:#c9a86a;
    --bg:#faf9fc; --card:#ffffff; --line:#e6e2f2;
    --ink:#2c2a38; --muted:#8b87a0; --deep:#322f45;
  }
  :root[data-scheme="french"]{ /* 參考 SimplyBook French：藍＋紅 */
    --primary:#2b5fb8; --primary-ink:#fff; --accent:#d8434e;
    --bg:#f7f9fc; --card:#ffffff; --line:#dfe6f0;
    --ink:#24303f; --muted:#7d8a9b; --deep:#1d2b3f;
  }
  :root[data-scheme="teal"]{ /* 參考 SimplyBook Teal Refresh：青綠＋橘 */
    --primary:#178f83; --primary-ink:#fff; --accent:#ef8354;
    --bg:#f4faf9; --card:#ffffff; --line:#d9ebe8;
    --ink:#223734; --muted:#77908c; --deep:#163833;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;
    font-family:"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .btn{display:inline-block;border:none;cursor:pointer;font:inherit;text-align:center;text-decoration:none;
    background:var(--primary);color:var(--primary-ink);font-weight:700;padding:10px 22px;border-radius:12px;}
  .btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);}
  .btn.small{padding:6px 14px;font-size:.88rem;border-radius:9px;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px;}
  .ph{background:linear-gradient(120deg,var(--theme-a),var(--theme-b));border:1px solid var(--line);position:relative;overflow:hidden;}
  .avatar{border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;}

  /* ===== 展示工具列 ===== */
  .toolbar{position:sticky;top:0;z-index:60;background:#23202b;color:#fff;padding:12px 16px;
    display:flex;flex-direction:column;align-items:flex-start;gap:9px;}
  .toolbar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;}
  .toolbar b{font-size:.85rem;flex:0 0 auto;min-width:34px;opacity:.75;}
  .toolbar .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .toolbar button{font:inherit;font-size:.8rem;cursor:pointer;border:1.5px solid rgba(255,255,255,.35);
    background:transparent;color:#fff;border-radius:99px;padding:4px 13px;}
  .toolbar button.on{background:#fff;color:#222;border-color:#fff;font-weight:700;}
  .note{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;font-size:.85rem;color:var(--muted);}
  .note b{color:var(--ink)}
  .note .fit{display:inline-block;margin-left:8px;font-size:.76rem;color:var(--primary);}

  /* ============ A 經典形象 ============ */
  .A .nav{display:flex;align-items:center;gap:18px;height:60px;}
  .A .nav b{font-size:1.1rem}
  .A .nav a{color:var(--ink);text-decoration:none;font-size:.92rem;opacity:.85}
  .A .nav .btn{margin-left:auto}
  .A .hero{background:linear-gradient(115deg,var(--theme-a),var(--theme-b));padding:76px 0;color:var(--theme-ink);}
  .A .hero h1{font-size:2.4rem;margin:0 0 10px;}
  .A .hero p{max-width:520px;opacity:.75;margin:0 0 24px;}
  .A h2{font-size:1.4rem;margin:44px 0 16px;}
  .A .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.A .cards{grid-template-columns:1fr;}}
  .A .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
  .A .card .ph{height:110px;border-radius:10px;margin-bottom:12px;}
  .A .card h3{margin:0 0 4px;font-size:1.02rem;}
  .A .meta{color:var(--muted);font-size:.83rem;margin-bottom:8px;}
  .A .price{color:var(--primary);font-weight:800;font-size:1.15rem;margin-bottom:12px;}
  .A .trow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .A .info3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:860px){.A .info3{grid-template-columns:1fr;}}
  .A .info3 .card h3{margin:0 0 10px;font-size:1rem;color:var(--primary);}
  .A .hrow{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--line);}
  .A .hrow:last-child{border-bottom:none;}
  .A .hrow.brk{color:var(--accent);font-size:.8rem;border-bottom:none;padding-top:0;}
  .A .foot{background:var(--deep);color:#eee;margin-top:56px;padding:22px 0;font-size:.85rem;}

  /* ============ C 側欄名片（側欄導覽＋多區塊內容） ============ */
  .C .shell{display:flex;min-height:640px;}
  .C .side{flex:0 0 300px;background:var(--card);border-right:1px solid var(--line);padding:32px 26px;}
  @media(max-width:900px){
    .C .cbanner{min-height:300px;}
    .C .cbanner h1{font-size:2.2rem;}
    .C .shell{display:block}
    .C .side{border-right:none;border-bottom:1px solid var(--line);}
    .C .toggle,.C.collapsed .rail{display:none;}
    .C.collapsed .side{flex-basis:auto;padding:32px 26px;}
    .C.collapsed .full{display:block;}
  }
  .C .side .logo{width:64px;height:64px;border-radius:18px;background:var(--primary);color:var(--primary-ink);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;margin-bottom:12px;}
  .C .side .status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    border-radius:99px;padding:4px 11px;margin-bottom:10px;}
  .C .side .status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .C .side h1{font-size:1.25rem;margin:0 0 12px;}
  .C .sidenav{display:flex;flex-direction:column;gap:2px;margin:0 0 16px;}
  .C .sidenav a{color:var(--ink);text-decoration:none;font-size:.92rem;padding:7px 10px;border-radius:8px;border-left:3px solid transparent;}
  .C .sidenav a:hover{background:var(--bg);}
  .C .sidenav a.on{color:var(--primary);font-weight:700;border-left-color:var(--primary);background:var(--bg);}
  .C .side p{color:var(--muted);font-size:.86rem;}
  .C .hours{font-size:.84rem;margin:16px 0;border-top:1px dashed var(--line);padding-top:12px;}
  .C .hours div{display:flex;justify-content:space-between;padding:3px 0;}
  .C .hours span:last-child{color:var(--muted)}
  .C .hours .brk{color:var(--accent);font-size:.78rem;}
  .C .hours .brk span:last-child{color:var(--accent);}
  .C .cinfo{font-size:.83rem;color:var(--muted);line-height:1.9;border-top:1px dashed var(--line);padding-top:12px;}
  .C .social{display:flex;gap:8px;margin-top:16px;}
  .C .social span{flex:1;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);
    border:1px solid var(--line);border-radius:8px;padding:6px 0;}
  /* 收合／展開 */
  .C .side{position:relative;transition:flex-basis .28s ease,padding .28s ease;}
  .C .toggle{position:absolute;top:14px;right:12px;z-index:3;display:flex;align-items:center;gap:4px;
    background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;
    font:inherit;font-size:.72rem;color:var(--muted);}
  .C .toggle:hover{color:var(--primary);border-color:var(--primary);}
  .C .toggle .ar{font-size:.95rem;line-height:1;}
  .C .rail{display:none;}
  .C.collapsed .side{flex-basis:76px;padding:18px 8px;}
  .C.collapsed .full{display:none;}
  .C.collapsed .toggle{display:none;}
  .C.collapsed .rail{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .C .rail-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;font-size:1.4rem;line-height:1;
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .C .rail-btn:hover{filter:brightness(1.08);}
  .C .rail-logo{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--primary-ink);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;}
  .C .rail-hint{writing-mode:vertical-rl;font-size:.72rem;letter-spacing:3px;color:var(--primary);font-weight:700;
    border-left:2px solid var(--primary);padding-left:5px;}
  .C .rail-nav{display:flex;flex-direction:column;gap:10px;align-items:center;
    border-top:1px dashed var(--line);padding-top:14px;width:100%;}
  .C .ri{font-size:1.05rem;opacity:.55;cursor:pointer;line-height:1;}
  .C .ri:hover{opacity:1;}
  .C .ri.on{opacity:1;}
  /* 橫幅 */
  /* 滿版橫幅：以負邊距抵銷 .main 內距，貼齊側欄與上、右邊界 */
  .C .cbanner{position:relative;overflow:hidden;border-radius:0;margin:-30px -30px 26px;
    min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:linear-gradient(135deg,var(--accent) -10%,var(--primary) 60%);color:#fff;}
  .C .cbanner h1{margin:0;font-size:3.1rem;letter-spacing:3px;text-shadow:0 3px 18px rgba(0,0,0,.22);z-index:2;}
  .C .cbanner .btn{z-index:2;background:#fff;color:var(--primary);padding:13px 46px;font-size:1.02rem;}
  .C .cbanner .arc{position:absolute;right:-120px;top:50%;transform:translateY(-50%);
    width:460px;height:460px;border-radius:50%;border:18px solid rgba(255,255,255,.3);}
  .C .cbanner .line{position:absolute;left:-2%;right:-2%;top:64%;height:14px;background:rgba(255,255,255,.28);
    transform:rotate(-3deg);}
  .C .cbanner .scrolldot{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);}
  .C .main{flex:1;padding:30px 30px 46px;min-width:0;}
  .C .main h2{margin:26px 0 14px;font-size:1.15rem;}
  .C .main h2:first-of-type{margin-top:20px;}
  .C .welcome{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;
    background:linear-gradient(120deg,var(--primary),var(--accent));color:#fff;border-radius:16px;padding:20px 24px;}
  .C .welcome .wtxt b{display:block;font-size:1.1rem;}
  .C .welcome .wtxt span{font-size:.8rem;opacity:.9;}
  .C .welcome .stats{display:flex;gap:20px;}
  .C .welcome .stats span{text-align:center;font-size:.74rem;opacity:.92;}
  .C .welcome .stats b{display:block;font-size:1.35rem;}
  .C .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:1120px){.C .grid{grid-template-columns:1fr;}}
  .C .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;}
  .C .card .bar{display:block;height:6px;}
  .C .card .bar.v0{background:linear-gradient(90deg,var(--primary),var(--accent));}
  .C .card .bar.v1{background:var(--deep);}
  .C .card .bar.v2{background:linear-gradient(90deg,var(--accent),var(--primary));}
  .C .cbody{padding:14px 16px 16px;}
  .C .ctop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .C .ctop h3{margin:0;font-size:1rem;}
  .C .price{font-weight:800;color:var(--primary);white-space:nowrap;}
  .C .chips{display:flex;gap:6px;margin:8px 0;}
  .C .chips span{font-size:.74rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:99px;padding:2px 9px;}
  .C .cbody p{color:var(--muted);font-size:.83rem;margin:0 0 12px;}
  .C .tcard{display:flex;gap:14px;align-items:center;padding:14px 16px;}
  .C .tcard h3{margin:0;font-size:.98rem;}
  .C .tcard .meta{color:var(--muted);font-size:.8rem;}
  .C .sessions{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow);}
  .C .srow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.88rem;}
  .C .srow:last-child{border-bottom:none;}
  .C .srow .date{display:flex;flex-direction:column;align-items:center;min-width:44px;font-size:.68rem;color:var(--muted);}
  .C .srow .date b{font-size:.95rem;color:var(--ink);}
  .C .srow .time{font-weight:700;color:var(--primary);min-width:52px;}
  .C .srow .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .C .srow .seat{font-size:.76rem;color:var(--muted);white-space:nowrap;}
  @media(max-width:640px){.C .srow .sname{white-space:normal;}.C .srow{flex-wrap:wrap;}}
  .C .reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:1120px){.C .reviews{grid-template-columns:1fr;}}
  .C .rv{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .C .rv .stars{color:var(--accent);letter-spacing:2px;font-size:.88rem;}
  .C .rv p{font-size:.85rem;color:var(--ink);margin:8px 0 10px;line-height:1.7;}
  .C .rv span{font-size:.78rem;color:var(--muted);}

  /* ============ D 雜誌圖文（排版驅動、不依賴照片） ============ */
  .D .hero{position:relative;overflow:hidden;min-height:440px;display:flex;align-items:center;color:#fff;
    background:linear-gradient(140deg,var(--primary) 0%,var(--accent) 100%);}
  .D .hero .ring{position:absolute;right:-120px;top:-120px;width:460px;height:460px;border-radius:50%;
    border:60px solid rgba(255,255,255,.10);}
  .D .hero .inner{position:relative;z-index:2;padding:56px 0;}
  .D .hero .eyebrow{display:inline-block;font-size:.78rem;letter-spacing:3px;font-weight:700;
    border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:5px 14px;margin-bottom:18px;}
  .D .hero h1{font-size:3rem;margin:0;letter-spacing:3px;line-height:1.15;}
  .D .hero p{opacity:.9;margin:10px 0 22px;font-size:1.05rem;}
  .D .hero .btn{background:#fff;color:var(--ink);}
  .D .feature{display:flex;gap:36px;align-items:center;margin:64px 0;}
  .D .feature:nth-child(even){flex-direction:row-reverse;}
  .D .plate{flex:1 1 0;min-height:280px;border-radius:18px;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;padding:26px;}
  .D .plate .ghost{position:absolute;right:.08em;top:-.26em;font-size:clamp(6rem,15vw,11rem);
    font-weight:900;line-height:1;color:rgba(255,255,255,.18);letter-spacing:-.05em;}
  .D .plate .plate-title{position:relative;z-index:2;color:#fff;font-weight:800;font-size:1.6rem;
    letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.2);}
  .D .plate.v0{background:linear-gradient(135deg,var(--primary),var(--accent));}
  .D .plate.v1{background:var(--deep);}
  .D .plate.v2{background:linear-gradient(135deg,var(--accent),var(--primary));}
  @media(max-width:820px){
    .D .feature{flex-direction:column !important;gap:18px;margin:44px 0;}
    .D .plate{flex:none;width:100%;min-height:210px;}
    .D .hero h1{font-size:2.2rem;}
  }
  .D .plate::after{content:'';position:absolute;inset:0;
    background:repeating-radial-gradient(circle at 0 0,rgba(255,255,255,.10) 0 2px,transparent 2px 15px);}
  .D .feature .txt{flex:1;}
  .D .feature .kicker{color:var(--primary);font-weight:700;font-size:.8rem;letter-spacing:2px;}
  .D .feature h3{font-size:1.5rem;margin:6px 0 8px;}
  .D .feature p{color:var(--muted);font-size:.95rem;margin:0 0 16px;}
  .D .feature .meta{font-size:.85rem;color:var(--muted);margin-bottom:16px;}
  .D .band{background:var(--deep);color:#f4f1ec;text-align:center;padding:52px 20px;margin-top:30px;}
  .D .band h2{margin:0 0 8px;font-size:1.4rem;}
  .D .band p{opacity:.75;margin:0 0 20px;font-size:.9rem;}

  /* ============ E 沉浸玻璃卡（疊層面板、不依賴照片） ============ */
  .E .hero{position:relative;padding:74px 0 130px;display:flex;align-items:center;
    background:radial-gradient(120% 120% at 18% 12%,var(--accent) 0%,transparent 52%),
               radial-gradient(120% 130% at 88% 88%,var(--primary) 0%,transparent 58%),
               linear-gradient(150deg,var(--deep),var(--primary));}
  .E .glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);
    border-radius:24px;padding:40px 44px;max-width:620px;color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.28);}
  .E .glass .eyebrow{display:inline-block;font-size:.76rem;letter-spacing:2px;font-weight:700;
    border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:4px 13px;margin-bottom:16px;}
  .E .glass h1{margin:0 0 6px;font-size:2.3rem;letter-spacing:2px;text-shadow:0 2px 14px rgba(0,0,0,.22);}
  .E .glass p{margin:0 0 10px;opacity:.94;font-size:1rem;}
  .E .glass .hours-mini{font-size:.8rem;opacity:.85;border-top:1px solid rgba(255,255,255,.3);padding-top:12px;margin-bottom:20px;}
  .E .glass .cta{display:flex;gap:10px;flex-wrap:wrap;}
  .E .glass .btn{background:#fff;color:var(--ink);}
  .E .glass .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);}
  /* 課程卡疊在 Hero 上——疊層面板的結構特徵 */
  .E .scroller{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 24px;
    margin-top:-76px;position:relative;z-index:2;}
  .E .ecard{flex:0 0 252px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;box-shadow:0 10px 30px rgba(30,20,10,.14);}
  .E .ecard .cap{display:block;height:8px;}
  .E .ecard .cap.v0{background:linear-gradient(90deg,var(--primary),var(--accent));}
  .E .ecard .cap.v1{background:var(--deep);}
  .E .ecard .cap.v2{background:linear-gradient(90deg,var(--accent),var(--primary));}
  .E .ecard .in{padding:16px 18px 18px;}
  .E .ecard .kick{color:var(--primary);font-weight:700;font-size:.72rem;letter-spacing:2px;}
  .E .ecard h3{margin:4px 0 6px;font-size:1rem;}
  .E .ecard p{color:var(--muted);font-size:.82rem;margin:0 0 10px;min-height:2.6em;}
  .E .ecard .meta{color:var(--muted);font-size:.78rem;margin-bottom:12px;}
  .E .ecard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .E .ecard .price{font-weight:800;color:var(--primary);}
  .E h2{font-size:1.25rem;margin:26px 0 14px;}
  .E .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:44px;}
  @media(max-width:760px){.E .tgrid{grid-template-columns:1fr;}}
  .E .tcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .E .tcard .meta{color:var(--muted);font-size:.82rem;}
  .E .strip{background:var(--deep);color:#eee;padding:20px 0;font-size:.86rem;text-align:center;}

  /* ============ G 純色極簡 ============ */
  .G .hero{background:var(--primary);color:var(--primary-ink);text-align:center;padding:96px 20px;}
  .G .hero h1{font-size:2.6rem;margin:0 0 6px;letter-spacing:4px;}
  .G .hero p{opacity:.85;margin:0 0 26px;}
  .G .hero .btn{background:var(--primary-ink);color:var(--primary);}
  .G .infoline{text-align:center;font-size:.85rem;color:var(--muted);padding:14px 16px;border-bottom:1px solid var(--line);}

  note:'<b>五套裡唯一以照片為主體的版型</b>（素材需求＝需要照片）：全幅照片 Hero＋課程區塊左右交錯，一課一張大圖、一個舞台。照片取自主題素材包的行業示意圖，租戶上架後換成自己的課程照。<b>缺圖時降級</b>為色塊＋序號＋放大標題（切「自建主題」可看降級後的樣子），不出現空白灰框。<b>首頁只放前 3 門精選</b>，其餘走「查看全部課程」頁。',

G:{ label:'G 純色極簡', assets:'none', schedule:'any', fit:['talent','sport','music','language','beauty','custom'],
  note:'純色塊 Hero＋<b>營業時間橫排</b>＋目錄式虛線課程列表，全程零照片（對應 SimplyBook Minimal／預設）——沒有圖片素材也不空洞，<b>自訂主題的通用預設版型</b>。',

};

/* ---- 切換邏輯 ---- */
const state = { layout:'A', theme:'talent' };
const stage = document.getElementById('stage');
const note = document.getElementById('noteBar');

/* D 雜誌圖文是「需要照片」等級的版型（規格「官網版型範本」1.2）：
   行業示意圖來自主題素材包，鋪到全幅 Hero 與課程大圖。
   自建主題套通用素材包、沒有行業示意圖 → 自動走 1.7 的降級呈現（色塊＋放大標題）。 */
/* 照片要合框：Hero 與課程大圖的框會隨視窗寬度改變比例（桌機 3.27:1／1.81:1，
   窄螢幕變成更扁的橫條），所以不用固定比例，改成量每一個框的實際尺寸去要圖——
   Unsplash 伺服器端按該尺寸裁切（crop=entropy 優先保住人臉），CSS cover 就不會再切掉東西。
   視窗改變時重抓（debounce）。 */
const IMG=(id,w,h)=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&crop=entropy&q=72&w=${w}&h=${h}`;
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
function fitURL(el,id){
  const r=el.getBoundingClientRect(), d=DPR();
  const w=Math.min(2400,Math.max(320,Math.round(r.width*d)));
  const h=Math.min(1600,Math.max(200,Math.round(r.height*d)));
  return IMG(id,w,h);
}
const SHADE='linear-gradient(rgba(22,18,14,.45),rgba(22,18,14,.45))';
function paintPhotos(){
  if(state.layout!=='D') return;
  const P=THEMES[state.theme].photos; if(!P) return;   // 自建主題：無素材，維持色塊
  const hero=stage.querySelector('.hero');
  if(hero){ hero.classList.add('pic'); hero.style.backgroundImage=`${SHADE},url("${fitURL(hero,P.hero)}")`; }
  stage.querySelectorAll('.plate').forEach((el,i)=>{
    el.classList.add('pic');
    el.style.backgroundImage=`url("${fitURL(el,P.pool[i%P.pool.length])}")`;
  });
}

function render(){
  const L = LAYOUTS[state.layout], T = THEMES[state.theme];
  document.documentElement.style.setProperty('--theme-a', T.hue[0]);
  document.documentElement.style.setProperty('--theme-b', T.hue[1]);
  document.documentElement.style.setProperty('--theme-ink', T.ink || '#33302c');
  stage.innerHTML = L.render(T);
  paintPhotos();
  const fitNames = L.fit.map(k=>THEMES[k].name).join('、');
  const fitTag = L.fit.includes(state.theme)
    ? `<span class="fit">✓ 適用主題：${fitNames}</span>`
    : `<span class="fit" style="opacity:.7;">△ 此版型未標記適用「${T.name}」——開通時不會優先顯示（仍可展開全部選用）</span>`;
  const ASSET_LABEL = {none:'免照片', optional:'選配照片', required:'需要照片'};
  const assetTag = `<span class="fit" style="opacity:.75;">素材需求：${ASSET_LABEL[L.assets]}${L.assets==='none'?'（租戶零素材也成立）':''}</span>`;
  const schedTag = L.schedule === 'any'
    ? `<span class="fit" style="opacity:.75;">排課型態：不限（單次／循環／套組／一次性活動皆可）</span>`
    : `<span class="fit" style="color:#b26a00;">⚠ 排課型態：僅適合<b>預約制</b>（單次／一對一）——套組與一次性活動不建議</span>`;
  const photoTag = state.layout!=='D' ? ''
    : T.photos
      ? `<span class="fit">📷 照片來自「${T.name}」主題素材包的行業示意圖（Unsplash 外連，需連網）</span>`
      : `<span class="fit" style="color:#b26a00;">⚠ 自建主題沒有行業示意圖 → 照片區塊<b>降級</b>為色塊＋放大標題（規格 1.7）</span>`;
  note.innerHTML = `<b>${L.label}</b>：${L.note}${fitTag}${assetTag}${schedTag}${photoTag}`;
  document.querySelectorAll('#layoutBtns button').forEach(b=>b.classList.toggle('on', b.dataset.l===state.layout));
  document.querySelectorAll('#themeBtns button').forEach(b=>b.classList.toggle('on', b.dataset.t===state.theme));
  window.scrollTo({top:0});
}

document.getElementById('layoutBtns').innerHTML =
  Object.entries(LAYOUTS).map(([k,v])=>`<button data-l="${k}">${v.label}</button>`).join('');
document.getElementById('themeBtns').innerHTML =
  Object.entries(THEMES).map(([k,v])=>`<button data-t="${k}">${v.name}</button>`).join('');

document.getElementById('layoutBtns').addEventListener('click', e=>{ if(e.target.dataset.l){ state.layout=e.target.dataset.l; render(); }});
document.getElementById('themeBtns').addEventListener('click', e=>{ if(e.target.dataset.t){ state.theme=e.target.dataset.t; render(); }});
document.getElementById('schemeBtns').addEventListener('click', e=>{
  if(e.target.dataset.s===undefined) return;
  document.documentElement.dataset.scheme = e.target.dataset.s;
  document.querySelectorAll('#schemeBtns button').forEach(b=>b.classList.toggle('on', b===e.target));
});
render();

/* 視窗尺寸改變 → 框的比例變了，重抓合尺寸的照片 */
let rz;
addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.layout==='D') paintPhotos(); }, 220); });
</script>
</body>
